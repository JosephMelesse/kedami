<!doctype html>
<!--
  The sandbox for the student's code and the imported LeetCode tests. It is loaded in an iframe with
  sandbox="allow-scripts" and no allow-same-origin, so it has an opaque origin: no access to the app's
  DOM, storage, or server token. Its CSP allows no network at all; Python runs as WebAssembly in a
  worker started from a data URL. Having no origin, it can't load scripts either, so the renderer posts it
  its script and Pyodide's binaries. See architecture/code-problems.md, Runner.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data:; worker-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
  </head>
  <body>
    <script>
      ;(() => {
        const send = (message) => parent.postMessage(message, '*')
        let run = null

        addEventListener('message', (event) => {
          if (event.source !== parent) return
          const message = event.data || {}
          if (message.type === 'load' && !run && typeof message.source === 'string') {
            try {
              const frame = new Function(`${message.source}\nreturn Bundle`)()
              run = frame.start(message.files, send)
            } catch (error) {
              send({ type: 'failed', message: String((error && error.message) || error) })
            }
          } else if (message.type === 'run' && run && typeof message.id === 'number') {
            run(message.id, message.request)
          }
        })

        send({ type: 'loaded' })
      })()
    </script>
  </body>
</html>
